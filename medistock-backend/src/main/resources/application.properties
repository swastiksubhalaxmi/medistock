# ============================================================
# application.properties.example
# Copy this file to application.properties and fill in values.
# application.properties is gitignored — never commit real passwords.
# ============================================================

# Database Configuration
# Uses local PostgreSQL by default, or DB_URL / DB_USERNAME / DB_PASSWORD environment variables when set
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=${PORT:8080}

# JWT Settings
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Inventory Settings
inventory.near-expiry-days=30
